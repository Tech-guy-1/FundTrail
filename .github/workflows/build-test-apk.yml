name: Build FundTrail test APKs

# Manual only: open the Actions tab, choose this workflow, press Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          npm install
          pip install pillow

      - name: Create the Android project
        run: |
          npx cap add android
          python tools/prepare_android.py
          npx cap sync android

      - name: Set the version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build both versions
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Test APK 1 (signed with Android's own test key)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FundTrail-test1-debugkey.apk

      - name: Test APK 2 (your key, older signature type only)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/fundtrail.p12"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/fundtrail.p12" --ks-type PKCS12 --ks-key-alias fundtrail \
            --ks-pass env:PW --key-pass env:PW \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false \
            --out FundTrail-test2-yourkey-v1v2.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose FundTrail-test2-yourkey-v1v2.apk

      - name: Publish as a test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" FundTrail-test1-debugkey.apk FundTrail-test2-yourkey-v1v2.apk \
            --title "FundTrail TEST ${{ github.run_number }}" \
            --notes "Two test APKs. Try test1 first." \
            --prerelease
